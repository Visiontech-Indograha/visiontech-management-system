# Konfigurasi ruff untuk api/ (dok 12 §7: ruff untuk format + lint).
target-version = "py312"
line-length = 110

[lint]
# Set aturan eksplisit (keputusan pemilik 2026-10-07; dulu kosong = bawaan E4/E7/E9/F saja).
# E/W pycodestyle · F pyflakes · I urutan impor · UP sintaks modern · B bugbear · RUF ruff ·
# DTZ datetime tanpa zona · BLE except terlalu luas · ASYNC pemblokir di async · SIM/C4/PIE penyederhanaan.
# Menambah/menghapus kode aturan = keputusan pemilik (tanyakan dulu, docs/12 §5).
select = ["E", "W", "F", "I", "UP", "B", "RUF", "DTZ", "BLE", "ASYNC", "SIM", "C4", "PIE"]

[lint.flake8-bugbear]
# Dependency FastAPI ditulis sebagai nilai default parameter (pola resmi FastAPI, dok 12 §2).
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Security",
    "app.api.deps.require_permission",  # pabrik dependency izin, dipakai sebagai Depends(...)
]

# ── Garis dasar utang lint (dok 17 §3: laporkan hanya yang BARU) ─────────────────────────────
# Hanya kode aturan spesifik yang masih ada per berkas per 2026-09-23 — BUKAN "ALL".
# Daftar ini hanya boleh menyusut: hapus barisnya begitu berkas dibersihkan (A-3/A-4 dst).
# Berkas baru tidak boleh ditambahkan ke sini.
[lint.per-file-ignores]
"app/api/v1/endpoints/assets.py" = ["BLE001"]
"app/api/v1/endpoints/attendance.py" = ["BLE001", "DTZ005"]  # DTZ005 = datetime.now() tanpa zona → A-4
"app/api/v1/endpoints/audit.py" = ["RUF013"]
"app/api/v1/endpoints/documents.py" = ["BLE001"]
"app/api/v1/endpoints/employees.py" = ["BLE001"]
"app/api/v1/endpoints/hse.py" = ["BLE001", "F841"]
"app/api/v1/endpoints/work_plans.py" = ["BLE001"]
"app/api/v1/endpoints/sites.py" = ["BLE001"]
"app/core/discord.py" = ["BLE001"]
"app/core/image.py" = ["BLE001"]
"app/core/pagination.py" = ["UP046"]
