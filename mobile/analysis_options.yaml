# Analyzer & lint Dart untuk mobile/ (keputusan pemilik 2026-10-07). `flutter analyze` wajib bersih di CI.
# Menambah/menghapus aturan = keputusan pemilik (tanyakan dulu). Alasan tiap pilihan di docs/11 bagian Mobile.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - lib/data/app_database.g.dart   # dibangkitkan drift_dev

linter:
  rules:
    # Keandalan async & sumber daya
    - unawaited_futures            # Future di fungsi async wajib di-await atau dibungkus unawaited(...)
    - cancel_subscriptions
    - close_sinks
    - only_throw_errors
    # Data JSON dari API (Map dinamis): akses harus lewat cast eksplisit, bukan panggilan dinamis
    - avoid_dynamic_calls
    # Gaya & keterbacaan (sebagian besar diperbaiki otomatis `dart fix --apply`)
    - avoid_print                  # pakai debugPrint/log; print bocor ke logcat produksi
    - prefer_single_quotes
    - prefer_final_locals
    - prefer_const_constructors
    - prefer_const_declarations
    - directives_ordering
    - prefer_relative_imports      # pola yang dipakai seluruh lib/
    - always_declare_return_types
    - unnecessary_lambdas
    - use_super_parameters
    - avoid_redundant_argument_values
