version: '3.8'

services:
  api:
    build:
      context: ./api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://vms_app:${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}@db:5432/visiontech_db
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api

  db:
    # PostgreSQL 18 + PostGIS 3.6 + pgvector (A-05) — citra yang sama dipakai CI.
    build: ./db
    image: vms-db:18
    environment:
      POSTGRES_USER: vms_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
      POSTGRES_DB: visiontech_db
    ports:
      - "5433:5432"
    volumes:
      # PG18 menyimpan data di /var/lib/postgresql/18/docker; volume baru agar data PG16 lama tidak tertimpa.
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vms_app -d visiontech_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres18_data:
