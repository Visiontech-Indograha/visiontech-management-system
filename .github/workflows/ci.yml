# CI — gerbang kualitas setiap push & PR (dok 17, docs/PLAN-PERBAIKAN-TEMUAN.md T-10).
# Semua langkah di sini sudah digladi lokal (database kosong dari db/*.sql → 199 uji hijau).
name: CI

on:
  push:
    branches: [prod, development, "feature/**"]
  pull_request:
    branches: [prod, development]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API · ruff · mypy · pytest (PostgreSQL nyata)
    runs-on: ubuntu-latest
    services:
      db:
        # Sama dengan docker-compose.yml / server dev (PostgreSQL 16 + PostGIS); pgvector dipasang di bawah.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: visiontech_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d visiontech_db"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Kredensial khusus container CI sekali pakai — bukan rahasia.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/visiontech_db
      VMS_REQUIRE_DB: "1"   # uji DB gagal (bukan dilewati) bila DB tak terjangkau
      PYTHONPATH: .
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"   # sama dengan Dockerfile (T-16)
          cache: pip
          cache-dependency-path: api/requirements-dev.txt

      - name: Pasang pgvector di container DB
        # Image postgis 16-3.4 berbasis Debian bullseye; repo PGDG bullseye sudah dipindah ke arsip
        # (apt.postgresql.org → 404, CI gagal 2026-10-02), jadi sumber apt diarahkan ke apt-archive.
        run: |
          docker exec ${{ job.services.db.id }} bash -c \
            "sed -i 's#http://apt.postgresql.org/#https://apt-archive.postgresql.org/#' /etc/apt/sources.list.d/pgdg.list \
             && apt-get update -qq && apt-get install -y -qq postgresql-16-pgvector >/dev/null"

      - name: Pasang skema dari db/*.sql (urutan 01 → 05)
        working-directory: db
        env:
          PGPASSWORD: postgres
        run: |
          for f in 01_schema 02_functions 03_policies 04_signature_auth 05_face; do
            psql -h localhost -U postgres -d visiontech_db -v ON_ERROR_STOP=1 -q -f "$f.sql"
          done

      - name: Pasang dependensi
        run: pip install -r requirements-dev.txt

      - name: Tandai migrasi (db/*.sql sudah memuat hasil migrasi 0002–0003)
        run: python -m alembic stamp head

      - name: Galat fatal — sintaks & nama tak terdefinisi (semua berkas, tanpa garis dasar)
        run: ruff check --isolated --select E9,F63,F7,F82 app tests

      - name: Lint (garis dasar di ruff.toml — hanya temuan BARU yang menggagalkan)
        run: ruff check app tests

      - name: Tipe — mypy --strict (seluruh app/)
        run: python -m mypy

      - name: Uji — pytest
        run: python -m pytest -q -p no:warnings

  web:
    name: Web · lint · typecheck · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  secrets:
    name: Pemindaian rahasia (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # gitleaks-action@v3 mewajibkan lisensi untuk akun organisasi (CI gagal 2026-10-02), jadi
      # CLI gitleaks (MIT, gratis) dipasang langsung — versi dikunci & checksum diperiksa.
      - name: Pasang gitleaks 8.30.1
        run: |
          curl -sSfL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks && rm gl.tgz
      - name: Pindai commit baru (push / PR) — sama dengan cakupan gitleaks-action
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ]; then range="$BASE_SHA..$HEAD_SHA"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then range="$BEFORE..$HEAD_SHA"
          else  # branch baru: commit yang belum ada di prod/development
            range="$HEAD_SHA --not $(git for-each-ref --format='%(objectname)' refs/remotes/origin/prod refs/remotes/origin/development | tr '\n' ' ')"
          fi
          echo "Rentang: $range"
          ./gitleaks git --redact --no-banner --exit-code 1 --log-opts="$range" .

  mobile:
    name: Mobile (Flutter analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  notify:
    name: Laporan ke #vms-ci
    needs: [api, web, mobile, secrets]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Kirim ke Discord (berhasil & gagal; tanpa data pribadi — dok 17 §2)
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_CI }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API: ${{ needs.api.result }}
          WEB: ${{ needs.web.result }}
          MOBILE: ${{ needs.mobile.result }}
          SECRETS: ${{ needs.secrets.result }}
          TITLE: ${{ github.event.head_commit.message || github.event.pull_request.title }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "DISCORD_WEBHOOK_CI belum diset; notifikasi dilewati."; exit 0; fi
          icon() { case "$1" in success) echo "✅";; skipped) echo "⏭️";; cancelled) echo "⚪";; *) echo "❌";; esac; }
          ok=true; for r in "$API" "$WEB" "$MOBILE" "$SECRETS"; do [ "$r" = success ] || [ "$r" = skipped ] || ok=false; done
          if $ok; then head="✅ CI berhasil"; color=3066993; else head="❌ CI GAGAL"; color=15158332; fi
          SUBJECT=$(printf '%s' "$TITLE" | head -1 | cut -c1-150)
          export HEAD="$head" COLOR="$color" SUBJECT
          export I_API=$(icon "$API") I_WEB=$(icon "$WEB") I_MOBILE=$(icon "$MOBILE") I_SECRETS=$(icon "$SECRETS")
          payload=$(python3 - <<'PY'
          import json, os
          e = os.environ
          desc = "\n".join([
              f"**Branch:** `{e['GITHUB_REF_NAME']}` · **Commit:** `{e['GITHUB_SHA'][:8]}`",
              f"**Pesan:** {e['SUBJECT']}",
              f"**Oleh:** {e['ACTOR']}",
              "",
              f"{e['I_API']} API (ruff, mypy, pytest)",
              f"{e['I_WEB']} Web (lint, typecheck, test, build)",
              f"{e['I_MOBILE']} Mobile (flutter analyze, test)",
              f"{e['I_SECRETS']} Pindai rahasia",
              "",
              f"[Buka log lengkap]({e['RUN_URL']})",
          ])
          print(json.dumps({"embeds": [{"title": e["HEAD"], "color": int(e["COLOR"]), "description": desc}]}))
          PY
          )
          curl -fsS -H "Content-Type: application/json" -X POST -d "$payload" "$WEBHOOK"
