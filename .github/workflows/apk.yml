# Build APK bertanda tangan untuk beta & prod (docs/40). Kunci rilis disimpan sebagai secret repo (privat):
#   ANDROID_KEYSTORE_B64 (isi vms-release-2.jks, base64), ANDROID_STORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Hasil di-push ke branch `rilis-apk-<env>` (satu commit, ditimpa); autodeploy.sh di server mengambilnya lewat
# kunci deploy yang sudah ada dan memasangnya ke folder pembaruan otomatis — server tidak butuh token tambahan.
name: APK

on:
  push:
    branches: [beta, prod]
    paths: ["mobile/**", ".github/workflows/apk.yml"]
  workflow_dispatch:
    inputs:
      env:
        description: Lingkungan
        type: choice
        options: [beta, prod]
        default: beta
      wajib:
        description: Wajibkan pembaruan (min_build = build ini)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: apk-${{ github.event.inputs.env || github.ref_name }}
  cancel-in-progress: true

# Tetap di ubuntu-24.04: runner self-hosted belum punya Android SDK (lihat docs/RUNBOOK-CI.md).
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ENV_NAME: ${{ github.event.inputs.env || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.inputs.env || github.ref_name }}
          fetch-depth: 0 # butuh jumlah commit penuh untuk nomor build beta

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: mobile/pubspec.yaml
          cache: true

      - name: Pasang kunci tanda tangan (dari secret, tidak pernah dicetak)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "Secret ANDROID_KEYSTORE_B64 belum diisi"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > mobile/android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # Nomor build: prod = pubspec (tidak berubah). Beta = max(pubspec, jumlah commit HEAD) supaya
      # tiap build beta baru naik (pembaruan dalam aplikasi mendeteksinya), tetap <= build prod berikutnya
      # (versi.sh memakai jumlah commit juga) dan jauh di bawah batas Android 2.100.000.000. Lihat docs/RILIS.md.
      - name: Tentukan nomor build
        run: |
          set -euo pipefail
          BASE=$(sed -n 's/^version:[[:space:]]*[0-9][0-9.]*+\([0-9]*\).*/\1/p' mobile/pubspec.yaml)
          BUILD=$BASE
          if [ "$ENV_NAME" = beta ]; then
            N=$(git rev-list --count HEAD)
            [ "$N" -gt "$BUILD" ] && BUILD=$N
          fi
          [ "$BUILD" -ge 1 ] && [ "$BUILD" -le 2100000000 ] || { echo "Nomor build $BUILD di luar batas"; exit 1; }
          echo "BUILD_NUMBER=$BUILD" >> "$GITHUB_ENV"

      - name: Build APK (${{ env.ENV_NAME }})
        working-directory: mobile
        run: |
          if [ "$ENV_NAME" = beta ]; then
            export VMS_BETA=1
            URL=https://visiontech-bar.tail827174.ts.net:10000
            EXTRA="--dart-define=VMS_BETA=true --dart-define=UPDATE_CHANNEL=beta"
          else
            URL=https://portal.visiontechindo.com
            EXTRA=""
          fi
          flutter pub get
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 \
            -Pforce-version-code-ignoring-abi=true --dart-define=API_BASE_URL="$URL" $EXTRA \
            --build-number="$BUILD_NUMBER" \
            --obfuscate --split-debug-info="$RUNNER_TEMP/sym"

      # Simbol debug untuk mendekode stack trace (flutter symbolize). Hanya artefak workflow, tidak dipublikasikan.
      - name: Simpan simbol debug (artefak privat)
        uses: actions/upload-artifact@v4
        with:
          name: simbol-debug-${{ github.run_id }}
          path: ${{ runner.temp }}/sym
          retention-days: 90
          if-no-files-found: error

      - name: Verifikasi tanda tangan = kunci rilis Visiontech & tulis latest.json
        env:
          WAJIB: ${{ github.event.inputs.wajib || 'false' }}
        run: |
          set -euo pipefail
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          WANT=$(grep -v '^#' deploy/android-release-cert.sha256 | tr -d '[:space:]')
          VER=$(sed -n 's/^version:[[:space:]]*\([0-9][0-9.]*\)+\([0-9]*\).*/\1 \2/p' mobile/pubspec.yaml)
          NAME=${VER% *}; BUILD=$BUILD_NUMBER
          PKG=com.visiontech.vms_mobile; [ "$ENV_NAME" = beta ] && PKG=$PKG.beta
          OUT="$RUNNER_TEMP/rilis"; mkdir -p "$OUT"
          FILES=""; SEP=""
          for apk in mobile/build/app/outputs/flutter-apk/app-*-release.apk; do
            ABI=$(basename "$apk" | sed 's/^app-\(.*\)-release\.apk$/\1/')
            GOT=$("$APKSIGNER" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
            [ "$GOT" = "$WANT" ] || { echo "APK $ABI ditandatangani kunci lain ($GOT) — dibatalkan"; exit 1; }
            DEST="vms-$NAME-$BUILD-$ABI.apk"; cp "$apk" "$OUT/$DEST"
            SHA=$(sha256sum "$OUT/$DEST" | cut -d' ' -f1); SIZE=$(stat -c %s "$OUT/$DEST")
            FILES="$FILES$SEP    {\"abi\": \"$ABI\", \"name\": \"$DEST\", \"sha256\": \"$SHA\", \"size\": $SIZE}"; SEP=$',\n'
          done
          MIN=1; [ "$WAJIB" = true ] && MIN=$BUILD
          printf '{\n  "package": "%s",\n  "version_name": "%s",\n  "build": %s,\n  "min_build": %s,\n  "released_at": "%s",\n  "notes": ["%s"],\n  "files": [\n%s\n  ]\n}\n' \
            "$PKG" "$NAME" "$BUILD" "$MIN" "$(TZ=Asia/Jakarta date -Iseconds)" \
            "$(git log -1 --format=%s | sed 's/"/\\"/g')" "$FILES" > "$OUT/latest.json"
          cat "$OUT/latest.json"
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: Terbitkan ke branch rilis-apk-${{ env.ENV_NAME }}
        run: |
          cd "$OUT"
          git init -q -b "rilis-apk-$ENV_NAME"
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add -A && git commit -q -m "APK $ENV_NAME $(sed -n 's/.*"version_name": "\(.*\)".*/\1/p' latest.json) dari ${GITHUB_SHA::8}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:rilis-apk-$ENV_NAME"
