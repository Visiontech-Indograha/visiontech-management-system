version: '3.8'
services:
  db:
    # Menggunakan image khusus yang sudah terpasang pgvector
    image: ankane/pgvector:latest
    container_name: postgres-face-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: absensi_wajah
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data: