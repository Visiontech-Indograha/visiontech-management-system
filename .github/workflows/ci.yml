# CI — gerbang kualitas setiap PR (dok 17, docs/PLAN-PERBAIKAN-TEMUAN.md T-10).
# Semua langkah di sini sudah digladi lokal (database kosong dari db/*.sql → 199 uji hijau).
#
# Hemat menit (keputusan pemilik 2026-10-08): paket Free = 2.000 menit/bulan untuk repo privat, habis
# tanggal 8 Oktober karena tiap commit berjalan dua kali (push + pull_request) dan uji API 8 menit ikut
# jalan untuk perubahan HP/dokumen saja. Kini: hanya pull_request (+ manual), dan api/web/mobile hanya
# berjalan bila bagiannya berubah. Merge ke development/prod tidak memicu ulang — kodenya sudah diuji di PR.
name: CI

on:
  pull_request:
    branches: [prod, development]
  workflow_dispatch:   # manual: semua job berjalan

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API · ruff · mypy · pytest (PostgreSQL nyata)
    needs: secrets
    if: ${{ !cancelled() && needs.secrets.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    env:
      # Kredensial khusus container CI sekali pakai — bukan rahasia.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/visiontech_db
      VMS_REQUIRE_DB: "1"   # uji DB gagal (bukan dilewati) bila DB tak terjangkau
      PYTHONPATH: .
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"   # sama dengan Dockerfile (T-16)
          cache: pip
          cache-dependency-path: api/requirements-dev.txt

      - name: Jalankan DB — PostgreSQL 18 + PostGIS 3.6 + pgvector dari db/Dockerfile (sama dengan compose)
        # Dulu: service postgis 16-3.4 + apt install pgvector saat berjalan. Repo PGDG bullseye diarsipkan
        # dan apt ikut memperbarui biner PG di bawah server yang sedang hidup (btree_gist.so gagal dimuat,
        # CI 2026-10-02). Citra dibangun dulu, baru server dinyalakan.
        working-directory: db
        run: |
          docker build -q -t vms-db:18 .
          docker run -d --name vms-db -p 5432:5432 -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=visiontech_db vms-db:18
          # Lewat TCP dari runner: selama init, server sementara citra hanya mendengar soket Unix.
          for i in $(seq 90); do
            pg_isready -h localhost -p 5432 -U postgres -d visiontech_db -q && break
            sleep 2
          done
          PGPASSWORD=postgres psql -h localhost -U postgres -d visiontech_db -Atc "show server_version"

      - name: Pasang skema Master Schema V2 (db/06) + DDL idempoten aplikasi (migration_v3)
        working-directory: db
        env:
          PGPASSWORD: postgres
        run: |
          for f in 06_master_schema_v2.sql 08_master_v2_tambahan.sql; do
            psql -h localhost -U postgres -d visiontech_db -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Pasang dependensi
        run: pip install -r requirements-dev.txt

      - name: Terapkan DDL aplikasi (V2 tidak memakai rantai alembic V1)
        run: python -c "import asyncio; from app.database.migration_v3 import apply_v3_migrations as m; asyncio.run(m())"

      - name: Galat fatal — sintaks & nama tak terdefinisi (semua berkas, tanpa garis dasar)
        run: ruff check --isolated --select E9,F63,F7,F82 app tests

      - name: Lint (garis dasar di ruff.toml — hanya temuan BARU yang menggagalkan)
        run: ruff check app tests

      - name: Tipe — mypy --strict (seluruh app/)
        run: python -m mypy

      - name: Uji — pytest
        run: python -m pytest -q -p no:warnings

      - name: Uji — face-service (aturan tantangan liveness, tanpa model)
        run: python -m pytest -q -p no:warnings ../face-service/tests

  web:
    name: Web · lint · typecheck · test · build
    needs: secrets
    if: ${{ !cancelled() && needs.secrets.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  secrets:
    # Juga menentukan bagian yang berubah (sudah mengambil seluruh riwayat) — tanpa job tambahan
    # yang memakan minimal 1 menit tertagih.
    name: Pemindaian rahasia (gitleaks)
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.changes.outputs.api }}
      web: ${{ steps.changes.outputs.web }}
      mobile: ${{ steps.changes.outputs.mobile }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # gitleaks-action@v3 mewajibkan lisensi untuk akun organisasi (CI gagal 2026-10-02), jadi
      # CLI gitleaks (MIT, gratis) dipasang langsung — versi dikunci & checksum diperiksa.
      - name: Pasang gitleaks 8.30.1
        run: |
          curl -sSfL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks && rm gl.tgz
      - name: Pindai commit baru (push / PR) — sama dengan cakupan gitleaks-action
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ]; then range="$BASE_SHA..$HEAD_SHA"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then range="$BEFORE..$HEAD_SHA"
          else  # branch baru: commit yang belum ada di prod/development
            range="$HEAD_SHA --not $(git for-each-ref --format='%(objectname)' refs/remotes/origin/prod refs/remotes/origin/development | tr '\n' ' ')"
          fi
          echo "Rentang: $range"
          ./gitleaks git --redact --no-banner --exit-code 1 --log-opts="$range" .
      - name: Bagian yang berubah (api / web / mobile)
        id: changes
        # Selalu jalan (juga bila gitleaks gagal) agar uji lain tetap memberi hasil.
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then   # manual: jalankan semua
            for k in api web mobile; do echo "$k=true" >> "$GITHUB_OUTPUT"; done; exit 0
          fi
          files=$(git diff --name-only "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" "$HEAD_SHA")
          echo "$files"
          hit() { if grep -qE "$1" <<<"$files"; then echo true; else echo false; fi; }
          wf='^\.github/workflows/ci\.yml$'
          echo "api=$(hit "^(api|db|face-service|deploy|scripts)/|$wf")" >> "$GITHUB_OUTPUT"
          echo "web=$(hit "^web/|$wf")" >> "$GITHUB_OUTPUT"
          echo "mobile=true" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  mobile:
    name: Mobile (Flutter analyze + test)
    needs: secrets
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  notify:
    name: Laporan ke #vms-ci
    needs: [api, web, mobile, secrets]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Kirim ke Discord (berhasil & gagal; tanpa data pribadi — dok 17 §2)
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_CI }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API: ${{ needs.api.result }}
          WEB: ${{ needs.web.result }}
          MOBILE: ${{ needs.mobile.result }}
          SECRETS: ${{ needs.secrets.result }}
          TITLE: ${{ github.event.head_commit.message || github.event.pull_request.title }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "DISCORD_WEBHOOK_CI belum diset; notifikasi dilewati."; exit 0; fi
          # Run yang dibatalkan `concurrency: cancel-in-progress` (ada push lebih baru ke branch yang sama)
          # bukan kegagalan — run pengganti yang akan melapor. Dulu terhitung "❌ CI GAGAL" (2026-10-02).
          for r in "$API" "$WEB" "$MOBILE" "$SECRETS"; do
            if [ "$r" = cancelled ]; then echo "Run dibatalkan (digantikan run lebih baru); notifikasi dilewati."; exit 0; fi
          done
          icon() { case "$1" in success) echo "✅";; skipped) echo "⏭️";; cancelled) echo "⚪";; *) echo "❌";; esac; }
          ok=true; for r in "$API" "$WEB" "$MOBILE" "$SECRETS"; do [ "$r" = success ] || [ "$r" = skipped ] || ok=false; done
          if $ok; then head="✅ CI berhasil"; color=3066993; else head="❌ CI GAGAL"; color=15158332; fi
          SUBJECT=$(printf '%s' "$TITLE" | head -1 | cut -c1-150)
          export HEAD="$head" COLOR="$color" SUBJECT
          export I_API=$(icon "$API") I_WEB=$(icon "$WEB") I_MOBILE=$(icon "$MOBILE") I_SECRETS=$(icon "$SECRETS")
          payload=$(python3 - <<'PY'
          import json, os
          e = os.environ
          desc = "\n".join([
              f"**Branch:** `{e['GITHUB_REF_NAME']}` · **Commit:** `{e['GITHUB_SHA'][:8]}`",
              f"**Pesan:** {e['SUBJECT']}",
              f"**Oleh:** {e['ACTOR']}",
              "",
              f"{e['I_API']} API (ruff, mypy, pytest)",
              f"{e['I_WEB']} Web (lint, typecheck, test, build)",
              f"{e['I_MOBILE']} Mobile (flutter analyze, test)",
              f"{e['I_SECRETS']} Pindai rahasia",
              "",
              f"[Buka log lengkap]({e['RUN_URL']})",
          ])
          print(json.dumps({"embeds": [{"title": e["HEAD"], "color": int(e["COLOR"]), "description": desc}]}))
          PY
          )
          curl -fsS -H "Content-Type: application/json" -X POST -d "$payload" "$WEBHOOK"
