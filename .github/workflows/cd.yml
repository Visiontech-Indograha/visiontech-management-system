# Penjaga sumber produksi. Deploy nyata dijalankan cron server melalui deploy/autodeploy.sh.
name: CD · Production source guard

on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-source-prod
  cancel-in-progress: false

jobs:
  verify-prod-source:
    name: Pastikan sumber deploy = prod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch prod
        uses: actions/checkout@v7
        with:
          ref: prod
          fetch-depth: 0

      - name: Verifikasi commit berasal dari prod
        shell: bash
        run: |
          git fetch --quiet origin prod
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/prod)"
          echo "Sumber produksi: prod @ $(git rev-parse --short HEAD)"

      - name: Periksa skrip deploy
        shell: bash
        run: |
          bash -n deploy/autodeploy.sh
          bash -n deploy/backup.sh
          grep -F 'BRANCH="${VMS_DEPLOY_BRANCH:-prod}"' deploy/autodeploy.sh

      - name: Catat mekanisme deploy nyata
        run: |
          echo "Server mengambil origin/prod tiap menit melalui deploy/autodeploy.sh."
          echo "Workflow ini hanya menjaga sumber prod; build, backup, migrasi, dan readiness dijalankan server."
