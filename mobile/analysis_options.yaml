# Analyzer & lint Dart untuk mobile/ (keputusan pemilik 2026-10-07). `flutter analyze` wajib bersih di CI.
# Menambah/menghapus aturan = keputusan pemilik (tanyakan dulu). Alasan tiap pilihan di docs/11 bagian Mobile.
include: package:very_good_analysis/analysis_options.yaml

plugins:
  riverpod_lint:
    version: ^3.2.0
    diagnostics:
      # BASELINE Fase 0: 8 pelanggaran belum dibereskan (hapus baris = aktif).
      avoid_public_notifier_properties: false

analyzer:
  # BASELINE Fase 0 (docs/MOBILE-LINT.md): mode ketat very_good_analysis dimatikan dulu; nyalakan satu per satu.
  language:
    strict-casts: false
    strict-inference: false
    strict-raw-types: false
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - lib/data/app_database.g.dart   # dibangkitkan drift_dev

linter:
  rules:
    # Keandalan async & sumber daya
    unawaited_futures: true            # Future di fungsi async wajib di-await atau dibungkus unawaited(...)
    cancel_subscriptions: true
    close_sinks: true
    only_throw_errors: true
    # Data JSON dari API (Map dinamis): akses harus lewat cast eksplisit, bukan panggilan dinamis
    avoid_dynamic_calls: true
    # Gaya & keterbacaan (sebagian besar diperbaiki otomatis `dart fix --apply`)
    avoid_print: true                  # pakai debugPrint/log; print bocor ke logcat produksi
    prefer_single_quotes: true
    prefer_final_locals: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    directives_ordering: true
    prefer_relative_imports: true      # pola yang dipakai seluruh lib/
    always_declare_return_types: true
    unnecessary_lambdas: true
    use_super_parameters: true
    avoid_redundant_argument_values: true

    # BASELINE Fase 0: pelanggaran very_good_analysis yang belum dibereskan (hapus baris = aturan aktif).
    always_put_required_named_parameters_first: false
    always_use_package_imports: false
    async_return_with_no_await: false
    avoid_catches_without_on_clauses: false
    avoid_catching_errors: false
    avoid_multiple_declarations_per_line: false
    avoid_positional_boolean_parameters: false
    avoid_slow_async_io: false
    cascade_invocations: false
    comment_references: false
    discarded_futures: false
    document_ignores: false
    eol_at_end_of_file: false
    lines_longer_than_80_chars: false
    matching_super_parameters: false
    noop_primitive_operations: false
    prefer_if_elements_to_conditional_expressions: false
    prefer_int_literals: false
    public_member_api_docs: false
    sort_constructors_first: false
    sort_pub_dependencies: false
    specify_nonobvious_property_types: false
    unnecessary_const_in_enum_constructor: false
    unnecessary_ignore: false
    unnecessary_parenthesis: false
    unnecessary_raw_strings: false
    unnecessary_type_name_in_constructor: false
    use_string_buffers: false
