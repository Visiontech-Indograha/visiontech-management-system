# Rilis (docs/RILIS.md): setiap push ke prod membuat tag vX.Y.Z dan GitHub Release dari VERSION
# serta bagian [X.Y.Z] di CHANGELOG.md. Gagal jelas bila VERSION belum naik, bagian CHANGELOG tidak ada,
# atau tag sudah ada. Hanya memakai GITHUB_TOKEN (izin contents: write), tanpa secret baru.
name: Rilis

on:
  push:
    branches: [prod]

permissions:
  contents: read

concurrency:
  group: rilis-prod
  cancel-in-progress: false

jobs:
  rilis:
    name: Tag & GitHub Release dari VERSION
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Baca dan validasi VERSION
        run: |
          v=$(tr -d '[:space:]' < VERSION)
          if ! [[ $v =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::VERSION '$v' bukan SemVer X.Y.Z"; exit 1
          fi
          echo "VERSI=$v" >> "$GITHUB_ENV"

      - name: Pastikan tag belum ada (VERSION harus naik)
        run: |
          git fetch --tags --force --quiet
          if git rev-parse -q --verify "refs/tags/v$VERSI" >/dev/null; then
            echo "::error::Tag v$VERSI sudah ada tetapi VERSION masih $VERSI. Naikkan VERSION dan CHANGELOG lewat PR ke development (lihat docs/RILIS.md)."
            exit 1
          fi

      - name: Ambil catatan rilis dari CHANGELOG.md
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::CHANGELOG.md tidak ada di repo. Catatan rilis v$VERSI tidak bisa diambil (lihat docs/RILIS.md)."
            exit 1
          fi
          awk -v h="## [$VERSI]" 'index($0, h) == 1 {f = 1; next} f && /^## / {exit} f' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md tidak punya bagian '## [$VERSI]' yang berisi catatan."
            exit 1
          fi

      - name: Buat tag dan GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSI" --target "$GITHUB_SHA" --title "v$VERSI" --notes-file "$RUNNER_TEMP/notes.md"
