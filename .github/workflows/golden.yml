name: Golden mobile

# Dijalankan manual untuk membuat ulang PNG golden di Linux (lihat mobile/test/goldens/README.md).
on:
  workflow_dispatch:
  push:
    branches: ['golden-update/**']

permissions:
  contents: read

jobs:
  golden:
    name: Buat ulang golden (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: mobile/pubspec.yaml
          cache: false
      - run: flutter pub get
      - run: flutter test --tags golden --update-goldens
      - uses: actions/upload-artifact@v4
        with:
          name: goldens
          path: mobile/test/goldens/*.png
