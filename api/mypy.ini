# mypy --strict (dok 12 §7) untuk modul yang sudah bersih. Daftar ini hanya boleh BERTAMBAH:
# modul baru / hasil refactor wajib masuk; modul lama menyusul saat dibersihkan.
[mypy]
python_version = 3.12
strict = True
ignore_missing_imports = True
follow_imports = silent
explicit_package_bases = True
files =
    app/api/auth.py,
    app/api/deps.py,
    app/api/attendance_cron.py,
    app/controllers/,
    app/core/alerts.py,
    app/core/enums.py,
    app/core/errors.py,
    app/core/permissions.py,
    app/core/security.py,
    app/core/storage.py,
    app/db/,
    app/repositories/base_repo.py,
    app/repositories/user_repo.py,
    app/repositories/session_repo.py,
    app/repositories/attendance_monitor_repo.py,
    app/repositories/plan_access_repo.py,
    app/repositories/org_ref_repo.py,
    app/repositories/file_access_repo.py,
    app/repositories/org_clock_repo.py,
    app/repositories/attendance_session_repo.py,
    app/services/attendance_session_service.py,
    app/api/attendance.py,
    app/repositories/plan_member_repo.py,
    app/api/guards.py,
    app/api/plan_members.py,
    app/services/plan_member_service.py,
    app/repositories/plan_transition_repo.py,
    app/services/plan_transition_service.py,
    app/api/plan_transitions.py,
    app/services/auth_service.py,
    app/services/attendance_monitor_service.py
