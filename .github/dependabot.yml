# Pembaruan dependensi otomatis (mingguan, dikelompokkan agar PR tidak membanjir). Peninjauan: CI wajib hijau.
version: 2
updates:
  - package-ecosystem: pip
    directory: /api
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: pub
    directory: /mobile
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /api
    schedule: { interval: weekly, day: monday }
